<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Analog Clock PiP</title>
  <style>
    :root {
      --background: #252525;
      --text-main: #fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--background);
      color: var(--text-main);
      padding: 24px;
      gap: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    #clock-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    canvas {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background-color: var(--background);
    }

    video {
      display: none;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    button {
      padding: 10px 20px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.2);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <div id="clock-card">
    <!-- 2倍解像度（380x380）で高精細化 -->
    <canvas id="clockCanvas" width="380" height="380"></canvas>
    <video id="videoElement" autoplay playsinline muted></video>
    <div class="button-group">
      <button id="pipButton" disabled>PiP非対応環境です</button>
      <button id="toggleSmooth">Smooth: OFF</button>
    </div>
    <div id="status">初期化中...</div>
  </div>

  <script>
    "use strict";

    const canvas = document.getElementById("clockCanvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("videoElement");
    const pipButton = document.getElementById("pipButton");
    const toggleButton = document.getElementById("toggleSmooth");
    const statusEl = document.getElementById("status");

    let stream = null;
    let clockTimer = null;
    let isSmooth = false;

    toggleButton.addEventListener("click", () => {
      isSmooth = !isSmooth;
      toggleButton.textContent = `Smooth: ${isSmooth ? "ON" : "OFF"}`;
    });

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function drawClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();
      const minutes = now.getMinutes();
      const hours = now.getHours() % 12;

      let secondDeg, minuteDeg, hourDeg;
      if (isSmooth) {
        secondDeg = seconds * 6 + milliseconds * 0.006;
        minuteDeg = minutes * 6 + seconds * 0.1 + milliseconds * 0.0001;
        hourDeg = hours * 30 + minutes * 0.5 + seconds * (0.5 / 60);
      } else {
        secondDeg = seconds * 6;
        minuteDeg = minutes * 6 + seconds * 0.1;
        hourDeg = hours * 30 + minutes * 0.5;
      }

      ctx.fillStyle = "#252525";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = canvas.width / 2;

      ctx.save();
      ctx.translate(cx, cy);

      ctx.font = "400 32px 'Ubuntu', sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let i = 1; i <= 12; i++) {
        const angle = (i * 30 - 90) * (Math.PI / 180);
        const dist = radius * 0.78;
        const x = Math.cos(angle) * dist;
        const y = Math.sin(angle) * dist;
        ctx.fillText(i, x, y);
      }

      ctx.save();
      ctx.rotate((hourDeg * Math.PI) / 180);
      ctx.fillStyle = "#eee";
      ctx.fillRect(-2, -32, 4, 32);
      ctx.beginPath();
      ctx.roundRect(-3, -96, 6, 84, 9999);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.rotate((minuteDeg * Math.PI) / 180);
      ctx.fillStyle = "#eee";
      ctx.fillRect(-2, -32, 4, 32);
      ctx.beginPath();
      ctx.roundRect(-3, -144, 6, 132, 9999);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.rotate((secondDeg * Math.PI) / 180);
      ctx.fillStyle = "#ffdd55";
      ctx.fillRect(-1, -170, 2, 194);
      ctx.restore();

      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#ffdd55";
      ctx.fill();

      ctx.restore();
    }

    function startClock() {
      drawClock();
      if (clockTimer) clearInterval(clockTimer);
      // SmoothがONのときは高頻度(30fps)、OFFのときは1秒ごとに描画
      clockTimer = setInterval(drawClock, 33);
    }

    function setupStream() {
      if (typeof canvas.captureStream !== "function") {
        setStatus("非対応ブラウザです");
        return false;
      }
      try {
        stream = canvas.captureStream(30);
        video.srcObject = stream;
        return true;
      } catch (e) {
        setStatus("ストリームエラー");
        return false;
      }
    }

    function checkPiP() {
      const hasWebKit = typeof video.webkitSupportsPresentationMode === "function";
      if (hasWebKit) {
        try {
          if (video.webkitSupportsPresentationMode("picture-in-picture")) {
            pipButton.disabled = false;
            setStatus("タップしてPiPを開始");
            return;
          }
        } catch (e) {}
      }
      if (typeof video.requestPictureInPicture === "function") {
        pipButton.disabled = false;
        setStatus("タップしてPiPを開始");
        return;
      }
      setStatus("PiP非対応環境です");
    }

    async function playVideo() {
      try {
        video.muted = true;
        video.playsInline = true;
        await video.play();
      } catch (e) {}
    }

    pipButton.addEventListener("click", async () => {
      await playVideo();

      if (typeof video.webkitSetPresentationMode === "function") {
        try {
          if (video.webkitPresentationMode === "picture-in-picture") {
            video.webkitSetPresentationMode("inline");
          } else {
            video.webkitSetPresentationMode("picture-in-picture");
          }
          return;
        } catch (e) {}
      }

      if (typeof video.requestPictureInPicture === "function") {
        try {
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
          } else {
            await video.requestPictureInPicture();
          }
        } catch (e) {}
      }
    });

    video.addEventListener("enterpictureinpicture", () => {
      pipButton.textContent = "ピクチャーインピクチャーを終了";
      setStatus("PiP再生中");
    });

    video.addEventListener("leavepictureinpicture", () => {
      pipButton.textContent = "ピクチャーインピクチャーを開始";
      setStatus("タップしてPiPを開始");
    });

    video.addEventListener("webkitpresentationmodechanged", () => {
      if (video.webkitPresentationMode === "picture-in-picture") {
        pipButton.textContent = "ピクチャーインピクチャーを終了";
        setStatus("PiP再生中");
      } else {
        pipButton.textContent = "ピクチャーインピクチャーを開始";
        setStatus("タップしてPiPを開始");
      }
    });

    async function init() {
      startClock();
      if (!setupStream()) return;
      await playVideo();
      checkPiP();
    }

    init();
  </script>
</body>

</html>
