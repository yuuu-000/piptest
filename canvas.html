<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Analog Clock PiP</title>
  <style>
    :root {
      --bg: #252525;
      --fg: #fff
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      padding: 24px;
      gap: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif
    }

    #clock-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px
    }

    #clockCanvas {
      width: 190px;
      height: 190px;
      display: block;
      border-radius: 50%;
      background: var(--bg)
    }

    #videoElement {
      position: fixed;
      left: -100px;
      top: -100px;
      width: 2px;
      height: 2px;
      opacity: .01;
      pointer-events: none
    }

    .button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px
    }

    button {
      padding: 10px 20px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, .2);
      background: rgba(255, 255, 255, .1);
      color: #fff;
      font-size: 14px;
      cursor: pointer
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    #status {
      font-size: 13px;
      color: #9ca3af
    }
  </style>
</head>

<body>
  <div id="clock-card">
    <canvas id="clockCanvas" width="570" height="570"></canvas>
    <video id="videoElement" autoplay playsinline muted></video>
    <div class="button-group">
      <button id="pipButton" disabled>PiP非対応環境です</button>
      <button id="toggleSmooth">Smooth: OFF</button>
    </div>
    <div id="status">初期化中...</div>
  </div>

  <script>
    "use strict";

    const canvas = document.getElementById("clockCanvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("videoElement");
    const pipButton = document.getElementById("pipButton");
    const toggleButton = document.getElementById("toggleSmooth");
    const statusEl = document.getElementById("status");

    let stream = null;
    let isSmooth = false;
    let rafId = null;
    let pipStarted = false;

    function setStatus(text) { statusEl.textContent = text }

    toggleButton.addEventListener("click", () => {
      isSmooth = !isSmooth;
      toggleButton.textContent = `Smooth: ${isSmooth ? "ON" : "OFF"}`;
    });

    function drawClock() {
      const now = new Date();
      const s = now.getSeconds();
      const ms = now.getMilliseconds();
      const m = now.getMinutes();
      const h = now.getHours() % 12;

      let secondDeg, minuteDeg, hourDeg;

      if (isSmooth) {
        secondDeg = s * 6 + ms * .006;
        minuteDeg = m * 6 + s * .1 + ms * .0001;
        hourDeg = h * 30 + m * .5 + s * (.5 / 60);
      } else {
        secondDeg = s * 6;
        minuteDeg = m * 6 + s * .1;
        hourDeg = h * 30 + m * .5;
      }

      ctx.fillStyle = "#252525";
      ctx.fillRect(0, 0, 570, 570);

      const cx = 285, cy = 285, radius = 285;

      ctx.save();
      ctx.translate(cx, cy);

      ctx.font = "400 32px Ubuntu,sans-serif";
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let i = 1; i <= 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const dist = radius * .78;
        ctx.fillText(i, Math.cos(angle) * dist, Math.sin(angle) * dist);
      }

      ctx.save();
      ctx.rotate(hourDeg * Math.PI / 180);
      ctx.fillStyle = "#eee";
      ctx.fillRect(-6, -64, 12, 64);
      ctx.beginPath();
      ctx.roundRect(-9, -192, 18, 168, 9999);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.rotate(minuteDeg * Math.PI / 180);
      ctx.fillStyle = "#eee";
      ctx.fillRect(-6, -64, 12, 64);
      ctx.beginPath();
      ctx.roundRect(-9, -288, 18, 264, 9999);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.rotate(secondDeg * Math.PI / 180);
      ctx.fillStyle = "#ffdd55";
      ctx.fillRect(-3, -340, 6, 388);
      ctx.restore();

      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fillStyle = "#ffdd55";
      ctx.fill();

      ctx.restore();
    }

    function startClock() {
      function loop() {
        drawClock();
        rafId = requestAnimationFrame(loop);
      }
      loop();
    }

    function isWebKitPiPSupported() {
      if (typeof video.webkitSupportsPresentationMode !== "function") return false;
      try {
        return video.webkitSupportsPresentationMode("picture-in-picture");
      } catch (e) {
        return false;
      }
    }

    function checkPiP() {
      if (isWebKitPiPSupported() || typeof video.requestPictureInPicture === "function") {
        pipButton.disabled = false;
        pipButton.textContent = "ピクチャーインピクチャーを開始";
        setStatus("タップしてPiPを開始");
      } else {
        pipButton.disabled = true;
        setStatus("PiP非対応環境です");
      }
    }

    async function createPiPStream() {
      if (stream) return true;

      if (typeof canvas.captureStream !== "function") {
        setStatus("captureStream非対応です");
        return false;
      }

      try {
        /*
         * ここで初めてCanvasをVideoへ接続する。
         * 通常のDOM表示中はsrcObjectを設定しない。
         */
        stream = canvas.captureStream(30);
        video.srcObject = stream;
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;

        /*
         * iOS WebKitではsrcObject設定直後に
         * play()する。
         */
        await video.play();

        return true;
      } catch (e) {
        console.error("PiP stream error:", e);
        setStatus("PiPストリームエラー");
        return false;
      }
    }

    async function startPiP() {
      if (pipStarted) {
        if (typeof video.webkitSetPresentationMode === "function") {
          try {
            video.webkitSetPresentationMode("inline");
            return;
          } catch (e) { }
        }

        if (document.pictureInPictureElement) {
          try {
            await document.exitPictureInPicture();
            return;
          } catch (e) { }
        }
      }

      const ok = await createPiPStream();
      if (!ok) return;

      if (typeof video.webkitSetPresentationMode === "function") {
        try {
          video.webkitSetPresentationMode("picture-in-picture");
          return;
        } catch (e) {
          console.error("WebKit PiP error:", e);
        }
      }

      if (typeof video.requestPictureInPicture === "function") {
        try {
          await video.requestPictureInPicture();
        } catch (e) {
          console.error("Standard PiP error:", e);
          setStatus("PiP開始に失敗しました");
        }
      }
    }

    pipButton.addEventListener("click", async () => {
      pipButton.disabled = true;
      await startPiP();
      setTimeout(() => { pipButton.disabled = false }, 300);
    });

    video.addEventListener("enterpictureinpicture", () => {
      pipStarted = true;
      pipButton.disabled = false;
      pipButton.textContent = "ピクチャーインピクチャーを終了";
      setStatus("PiP再生中");
    });

    video.addEventListener("leavepictureinpicture", () => {
      pipStarted = false;
      pipButton.disabled = false;
      pipButton.textContent = "ピクチャーインピクチャーを開始";
      setStatus("タップしてPiPを開始");
    });

    video.addEventListener("webkitpresentationmodechanged", () => {
      if (video.webkitPresentationMode === "picture-in-picture") {
        pipStarted = true;
        pipButton.disabled = false;
        pipButton.textContent = "ピクチャーインピクチャーを終了";
        setStatus("PiP再生中");
      } else {
        pipStarted = false;
        pipButton.disabled = false;
        pipButton.textContent = "ピクチャーインピクチャーを開始";
        setStatus("タップしてPiPを開始");
      }
    });

    startClock();
    checkPiP();
  </script>
</body>

</html>
